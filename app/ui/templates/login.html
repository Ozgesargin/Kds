{% extends "auth_layout.html" %}

{% block title %}Giriş Yap{% endblock %}
{% block heading %}Öğretmen Hesabına Giriş Yap{% endblock %}

{% block content %}

    {% if error %}
        <p class="text-red-500 text-center mb-4 text-sm font-medium">{{ error }}</p>
    {% endif %}

    <form method="POST" action="{{ url_for('login') }}">

        <div class="mb-4">
            <label for="email" class="block text-sm font-medium text-gray-700">E-posta Adresi</label>
            <input type="email" id="email" name="email" required class="mt-1 block w-full border border-gray-300 rounded-lg shadow-sm p-3 focus:ring-indigo-500 focus:border-indigo-500 transition duration-150" placeholder="ayse.yilmaz@okul.edu">
        </div>

        <div class="mb-6">
            <label for="password" class="block text-sm font-medium text-gray-700">Şifre</label>
            <input type="password" id="password" name="password" required class="mt-1 block w-full border border-gray-300 rounded-lg shadow-sm p-3 focus:ring-indigo-500 focus:border-indigo-500 transition duration-150" placeholder="••••••••">
        </div>

        <button type="submit" class="w-full py-3 px-4 border border-transparent rounded-lg shadow-md text-base font-semibold text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition duration-150">
            Giriş Yap
        </button>
    </form>
{% endblock %}
