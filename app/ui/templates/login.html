{% extends "auth_layout.html" %}

{% block title %}Giriş Yap - Eğitmen Paneli{% endblock %}
{% block heading %}Öğretmen Hesabına Giriş Yap{% endblock %}

{% block content %}

    {% if error %}
        <p class="text-rose-600 bg-rose-50 border border-rose-200 rounded-lg px-3 py-2 text-xs font-medium mb-4 text-center">
            {{ error }}
        </p>
    {% endif %}

    <form method="POST" action="{{ url_for('login') }}" class="space-y-4">
        <div>
            <label for="email" class="block text-xs font-medium text-slate-600 mb-1.5">
                Kullanıcı Adı
            </label>
            <input type="text" id="email" name="email" required
                   class="mt-1 block w-full border border-slate-300 rounded-lg px-3 py-2 text-sm
                          text-slate-900 placeholder:text-slate-400
                          focus:outline-none focus:ring-2 focus:ring-slate-900 focus:border-slate-900"
                   placeholder="ogr_pk22059_1">
        </div>

        <div>
            <label for="password" class="block text-xs font-medium text-slate-600 mb-1.5">
                Şifre
            </label>
            <input type="password" id="password" name="password" required
                   class="mt-1 block w-full border border-slate-300 rounded-lg px-3 py-2 text-sm
                          text-slate-900 placeholder:text-slate-400
                          focus:outline-none focus:ring-2 focus:ring-slate-900 focus:border-slate-900"
                   placeholder="••••••••">
        </div>

        <button type="submit"
                class="w-full py-2.5 px-4 rounded-lg text-sm font-semibold text-white bg-slate-900
                       hover:bg-slate-800 transition">
            Giriş Yap
        </button>
    </form>

{% endblock %}
