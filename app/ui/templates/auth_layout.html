<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Eğitmen Paneli{% endblock %}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center">
<div class="max-w-md w-full p-8 bg-white rounded-2xl shadow-xl border border-slate-200">
    <div class="text-center mb-6">
        <p class="text-xs font-semibold tracking-[0.14em] text-slate-400 uppercase">
            Eğitmen Paneli
        </p>
        <h1 class="text-2xl font-extrabold text-slate-900">
            {% block heading %}{% endblock %}
        </h1>
    </div>

    {% block content %}{% endblock %}

    <p class="mt-6 text-[11px] text-center text-slate-400">
        Kişiselleştirilmiş soru öneri ve ödev sistemi.
    </p>
</div>
</body>
</html>
